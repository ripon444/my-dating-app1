<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff69b4"/>
      <stop offset="40%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="innerHeartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff758c"/>
      <stop offset="50%" stop-color="#ff2a6d"/>
      <stop offset="100%" stop-color="#d90368"/>
    </linearGradient>
    <radialGradient id="gloss" cx="35%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#f43f5e" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Figure (Pink Couple Half) -->
  <!-- Left Head -->
  <circle cx="150" cy="105" r="34" fill="url(#pinkGrad)"/>
  <circle cx="142" cy="97" r="16" fill="url(#gloss)"/>
  <!-- Left Body forming left heart arc -->
  <path d="M 170 145 C 105 155 75 220 80 290 C 85 365 190 440 256 475 C 215 410 145 350 145 270 C 145 205 195 160 256 215 C 240 170 210 145 170 145 Z" fill="url(#pinkGrad)"/>

  <!-- Right Figure (White Couple Half) -->
  <!-- Right Head -->
  <circle cx="362" cy="105" r="34" fill="url(#whiteGrad)"/>
  <circle cx="354" cy="97" r="16" fill="url(#gloss)"/>
  <!-- Right Body forming right heart arc -->
  <path d="M 342 145 C 407 155 437 220 432 290 C 427 365 322 440 256 475 C 297 410 367 350 367 270 C 367 205 317 160 256 215 C 272 170 302 145 342 145 Z" fill="url(#whiteGrad)"/>

  <!-- Inner Center Heart -->
  <g filter="url(#glow)">
    <path d="M 256 270 C 235 240 190 242 190 282 C 190 320 235 355 256 380 C 277 355 322 320 322 282 C 322 242 277 240 256 270 Z" fill="url(#innerHeartGrad)"/>
    <!-- Heart Gloss highlight -->
    <path d="M 256 270 C 240 248 205 250 202 280 C 215 260 245 258 256 270 Z" fill="#ffffff" opacity="0.45"/>
  </g>
</svg>
